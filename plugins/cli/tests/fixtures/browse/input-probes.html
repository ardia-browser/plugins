<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>input probes</title>
<style>
  body { font: 14px sans-serif; margin: 20px; }
  button { margin: 6px; padding: 6px 12px; }
  .editor { border: 1px solid #333; min-height: 30px; width: 320px; margin: 6px; }
  [role="menu"] { border: 1px solid #999; padding: 4px; width: 160px; }
</style>
</head>
<body>
<button id="menu-trigger" aria-haspopup="menu" aria-expanded="false" data-state="closed">Options</button>
<input id="other" aria-label="Other field">
<input id="echo" aria-label="Echo field" value="start">
<div id="dead" role="button" style="display:inline-block;padding:6px 12px;border:1px solid #999;user-select:none">Dead button</div>
<div id="slides" class="editor" contenteditable="true" role="textbox" aria-label="Slide text"></div>
<div id="menus"></div>
<script>
  const state = { opened: 0, dead: 0 };
  globalThis.state = state;
  const trigger = document.getElementById("menu-trigger");
  trigger.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;
    event.preventDefault();
    const open = trigger.getAttribute("aria-expanded") !== "true";
    trigger.setAttribute("aria-expanded", String(open));
    trigger.dataset.state = open ? "open" : "closed";
    const menus = document.getElementById("menus");
    menus.textContent = "";
    if (open) {
      state.opened += 1;
      const menu = document.createElement("div");
      menu.setAttribute("role", "menu");
      menu.innerHTML = '<div role="menuitem" tabindex="-1">Rename</div><div role="menuitem" tabindex="-1">Delete</div>';
      menus.appendChild(menu);
    }
  });
  const dead = document.getElementById("dead");
  for (const type of ["pointerdown", "pointerup", "mousedown", "mouseup", "click"]) {
    addEventListener(type, (event) => {
      const target = event.target;
      if (target !== dead) return;
      event.stopImmediatePropagation();
      if (type === "pointerdown") state.dead += 1;
    }, true);
  }
  const slides = document.getElementById("slides");
  addEventListener("beforeinput", (event) => {
    if (event.target !== slides || event.inputType !== "insertText") return;
    event.stopImmediatePropagation();
    event.preventDefault();
    slides.textContent += event.data;
  }, true);
  const echo = document.getElementById("echo");
  echo.addEventListener("focus", () => setTimeout(() => { echo.value += "abc"; }, 300));
  addEventListener("beforeinput", (event) => {
    if (event.target !== echo) return;
    event.stopImmediatePropagation();
    event.preventDefault();
  }, true);
  if (location.search.includes("churn")) {
    const other = document.getElementById("other");
    setInterval(() => {
      other.value += "x";
      const menus = document.getElementById("menus");
      menus.textContent = "";
      if (other.value.length % 2) menus.innerHTML = '<div role="dialog" aria-label="Feedback">Rate us</div>';
    }, 100);
  }
</script>
</body>
</html>
