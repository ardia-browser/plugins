<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Row 16 · Print and save</title>
<style>
body{font:14px system-ui;margin:16px}
#verdict{font:bold 20px system-ui}.pass{color:#080}.fail{color:#c00}
@media print{#marker::after{content:" (print media)"}}
button{width:200px;height:32px}
</style>
<div id="verdict">RUNNING row 16</div>
<p id="marker">row16-print-marker</p>
<button id="print">window.print()</button>
<pre id="measured"></pre>
<script>
const ROW = 16;
function report(pass, measured) {
  const result = {row: ROW, pass: !!pass, measured};
  window.__humanResult = result;
  document.documentElement.dataset.humanResult = JSON.stringify(result);
  const verdict = document.getElementById('verdict');
  verdict.textContent = (pass ? 'PASS' : 'FAIL') + ' row ' + ROW;
  verdict.className = pass ? 'pass' : 'fail';
  document.getElementById('measured').textContent = JSON.stringify(measured, null, 2);
}
function onFinish(run) {
  let done = false;
  const go = () => {
    if (done || !document.documentElement.hasAttribute('data-finish')) return;
    done = true;
    Promise.resolve().then(run).catch(error => report(false, {error: String(error)}));
  };
  new MutationObserver(go).observe(document.documentElement, {attributes: true, attributeFilter: ['data-finish']});
  go();
}
function driverRead() {
  try { return JSON.parse(document.documentElement.dataset.read || 'null'); } catch { return null; }
}
</script>
<script>
const measured = {printEvents: [], printCall: null};
window.addEventListener('beforeprint', () => measured.printEvents.push('beforeprint'));
window.addEventListener('afterprint', () => measured.printEvents.push('afterprint'));
document.getElementById('print').addEventListener('click', event => {
  const started = performance.now();
  window.print();
  measured.printCall = {trusted: event.isTrusted, blockedMs: Math.round(performance.now() - started)};
});
onFinish(() => {
  const read = driverRead() || {};
  measured.driverRead = read;
  const checks = {
    printToPdf: read.pdfHeader === '%PDF-' && read.pdfBytes > 1000,
    pdfPages: read.pdfPages >= 1,
    savePage: read.mhtmlHasMarker === true,
    printDialogAnswered: read.printDialogAnswered === true,
  };
  measured.checks = checks;
  report(Object.values(checks).every(Boolean), measured);
});
</script>
</html>
