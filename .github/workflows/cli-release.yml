name: Command Line release

on:
  pull_request:
    paths: ["plugins/cli/**", ".github/workflows/cli-release.yml"]
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check everything, publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: read
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("plugins/cli/plugin.json"))["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]] || { echo "::error::plugins/cli/plugin.json's version '$version' isn't a version"; exit 1; }
          publish=false
          if [ "$EVENT" = push ]; then
            [ "$REF" = "refs/tags/cli-v$version" ] || { echo "::error::the tag $REF isn't cli-v$version, plugin.json's version"; exit 1; }
            publish=true
          elif [ "$EVENT" = workflow_dispatch ] && [ "$DRY_RUN" = false ]; then
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "### Command Line $version ($([ "$publish" = true ] && echo publish || echo dry run))" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    name: Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            cache: ~/Library/Caches/ardia-cli-build
          - os: ubuntu-24.04
            platform: linux-x64
            cache: ~/.cache/ardia-cli-build
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.cache }}
          key: ardia-cli-build-${{ matrix.platform }}-${{ hashFiles('plugins/cli/scripts/build.sh') }}
      - name: Build
        run: ARDIA_PLUGIN_VERSION="$VERSION" plugins/cli/build.sh "$RUNNER_TEMP/out"
      - name: Check
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          test "$("$out/cli/bin/ardia" --version)" = "ardia $VERSION"
          test -f "$out/cli/bin/ardia-libc.so"
          test "$("$out/cli/libexec/esbuild" --version)" = 0.28.2
          ! test -e "$out/cli/python"
          grep -q "\"version\": \"$VERSION\"" "$out/cli/plugin.json"
          (cd "$out" && { command -v sha256sum >/dev/null && sha256sum -c ./*.sha256 || shasum -a 256 -c ./*.sha256; })
          links=$(tar -tvzf "$out/cli-plugin-$VERSION-${{ matrix.platform }}.tar.gz" | grep -c '^l' || true)
          [ "$links" = 0 ] || { echo "::error::the plugin folder has $links links: Ardia refuses them"; exit 1; }
          echo "- ${{ matrix.platform }}: $(du -sh "$out/cli" | cut -f1) folder, bin/ardia $(wc -c < "$out/cli/bin/ardia") bytes, plugin tarball $(wc -c < "$out/cli-plugin-$VERSION-${{ matrix.platform }}.tar.gz") bytes" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/out/ardia-cli-${{ env.VERSION }}-${{ matrix.platform }}.tar.gz
            ${{ runner.temp }}/out/ardia-cli-${{ env.VERSION }}-${{ matrix.platform }}.tar.gz.sha256
            ${{ runner.temp }}/out/cli-plugin-${{ env.VERSION }}-${{ matrix.platform }}.tar.gz
            ${{ runner.temp }}/out/cli-plugin-${{ env.VERSION }}-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Release
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/assets"
          cp plugins/cli/install.sh "$assets/install.sh"
          (cd "$assets" && sha256sum install.sh > install.sh.sha256 && sha256sum -c ./*.sha256)
          gh release view "cli-v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo "::error::cli-v$VERSION is already released"; exit 1; }
          gh release create "cli-v$VERSION" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Command Line $VERSION" \
            --notes "The ardia command $VERSION. Ardia pins it in apps/browser/official-plugins.json (scripts/release/official-plugins.py pin cli $VERSION); install.sh installs it by hand with --version $VERSION --sha256 <the tarball's .sha256>." \
            "$assets"/*
          echo "Released cli-v$VERSION: pin it in ardia with scripts/release/official-plugins.py pin cli $VERSION" >> "$GITHUB_STEP_SUMMARY"
