name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ardia_packages:
        description: owner/repo@tag of a release with ardia-plugin-sdk and ardia-plugin-cli tarballs (empty takes them from npm)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ARDIA_PACKAGES: ${{ inputs.ardia_packages || vars.ARDIA_PACKAGES_RELEASE || '' }}

jobs:
  route:
    name: Which plugins changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      js: ${{ steps.route.outputs.js }}
      cli: ${{ steps.route.outputs.cli }}
      packages: ${{ steps.route.outputs.packages }}
      parity: ${{ steps.route.outputs.parity }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - id: route
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            node scripts/plugins.mjs list --changed "origin/$BASE" --github-output --json
          else
            node scripts/plugins.mjs list --github-output --json
          fi
          cli=$(sed -n 's/^cli=//p' "$GITHUB_OUTPUT" | tail -n 1)
          parity=false
          [ "$cli" = false ] || [ -z "$(git ls-tree --name-only HEAD plugins/cli/ts/tests/parity)" ] || parity=true
          echo "parity=$parity" >> "$GITHUB_OUTPUT"
          {
            echo "### Plugins checked"
            echo "- JS: $(sed -n 's/^js=//p' "$GITHUB_OUTPUT" | tail -n 1)"
            echo "- cli: $cli (parity: $parity)"
          } >> "$GITHUB_STEP_SUMMARY"

  scripts:
    name: Release and workspace scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ardia-packages: ${{ env.ARDIA_PACKAGES }}
      - run: pnpm run test:scripts
      - name: The shell scripts parse
        run: |
          set -euo pipefail
          sh -n install.sh
          sh -n plugins/cli/install.sh
          sh -n plugins/cli/build.sh
          bash -n .github/release/check-build.sh
          bash -n .github/release/sign-macos.sh

  packages:
    name: Workspace packages
    needs: route
    if: needs.route.outputs.packages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ardia-packages: ${{ env.ARDIA_PACKAGES }}
      - name: Type check and test every package under packages/
        run: |
          set -euo pipefail
          pnpm --filter './packages/*' run --if-present typecheck
          pnpm --filter './packages/*' run --if-present test

  plugin:
    name: ${{ matrix.plugin }}
    needs: route
    if: needs.route.outputs.js != '[]' && needs.route.outputs.js != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.route.outputs.js) }}
    env:
      PLUGIN: ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ardia-packages: ${{ env.ARDIA_PACKAGES }}
      - name: Build and ardia-plugin check
        run: node scripts/plugins.mjs check "$PLUGIN"
      - name: Type check
        run: node scripts/plugins.mjs typecheck "$PLUGIN"
      - name: Unit tests
        run: node scripts/plugins.mjs test "$PLUGIN"
      - name: Pack as the release does
        run: |
          set -euo pipefail
          node scripts/plugins.mjs pack "$PLUGIN" --out "$RUNNER_TEMP/pack"
          (cd "$RUNNER_TEMP/pack" && sha256sum -c ./*.sha256)
          for file in "$RUNNER_TEMP/pack"/*.tar.gz; do
            echo "- $PLUGIN: $(basename "$file"), $(wc -c < "$file") bytes, $(cut -d' ' -f1 "$file.sha256")" >> "$GITHUB_STEP_SUMMARY"
          done

  cli-main:
    name: cli main
    needs: route
    if: needs.route.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ardia-packages: ${{ env.ARDIA_PACKAGES }}
      - name: Type check, build and test plugins/cli/main
        run: |
          set -euo pipefail
          node scripts/plugins.mjs typecheck cli
          node scripts/plugins.mjs build cli
          node scripts/plugins.mjs test cli
          node scripts/plugins.mjs check cli

  typescript:
    name: TypeScript ardia on ${{ matrix.os }}
    needs: route
    if: needs.route.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cache: ~/Library/Caches/ardia-cli-build
            platform: macos-arm64
          - os: ubuntu-24.04
            cache: ~/.cache/ardia-cli-build
            platform: linux-x64
    defaults:
      run:
        working-directory: plugins/cli/ts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: ./.github/actions/setup
        with:
          ardia-packages: ${{ env.ARDIA_PACKAGES }}
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.cache }}
          key: ardia-cli-build-${{ matrix.platform }}-${{ hashFiles('plugins/cli/scripts/build.sh') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Type check (tsrs)
        run: ./node_modules/.bin/tsrs --noEmit -p .
      - name: Type check the browse daemon harness (tsrs)
        run: ./node_modules/.bin/tsrs --noEmit -p tests/m3
      - name: Build the program and its libc addon, the addon checked against Node's own Node-API headers
        run: sh scripts/build.sh --node-headers "$(dirname "$(dirname "$(realpath "$(command -v node)")")")/include/node"
      - name: Size
        run: |
          echo "ardia-ts binary: $(wc -c < dist/ardia-ts) bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "ardia-libc.so addon: $(wc -c < dist/ardia-libc.so) bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the plugin folder and its registry asset as the release does, and check them
        working-directory: .
        env:
          ARDIA_DATA_DIR: ${{ runner.temp }}/data
          ARDIA_TELEMETRY: "off"
        run: |
          set -euo pipefail
          version=$(node -p 'require("./plugins/cli/plugin.json").version')
          plugins/cli/build.sh "$RUNNER_TEMP/out"
          .github/release/check-build.sh "$RUNNER_TEMP/out" "$version"
          node scripts/plugins.mjs check cli --cli-out "$RUNNER_TEMP/out"
          node scripts/plugins.mjs pack cli --cli-out "$RUNNER_TEMP/out" --out "$RUNNER_TEMP/out"
      - name: Unit tests, one file per core at a time
        run: bun run test

  parity:
    name: Parity on ${{ matrix.os }}
    needs: route
    if: needs.route.outputs.parity == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    defaults:
      run:
        working-directory: plugins/cli/ts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the TypeScript ardia
        run: sh scripts/build.sh
      - name: Parity cases against their captured results
        run: bun run test:parity

  schema:
    name: The ardia command's vendored plugin schema is ardia main's
    needs: route
    if: needs.route.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: plugins/cli/ts/assets
      - name: Compare with ardia main's docs/plugin.schema.json
        run: |
          ardia_ref=main
          set -euo pipefail
          url=https://raw.githubusercontent.com/ardia-browser/ardia/$ardia_ref/docs/plugin.schema.json
          if ! curl -fsSL "$url" -o "$RUNNER_TEMP/ardia-plugin.schema.json"; then
            echo "::warning::ardia $ardia_ref doesn't publish docs/plugin.schema.json: the vendored schema wasn't compared"
            exit 0
          fi
          diff -u "$RUNNER_TEMP/ardia-plugin.schema.json" plugins/cli/ts/assets/plugin.schema.json \
            || { echo "::error::plugins/cli/ts/assets/plugin.schema.json isn't ardia $ardia_ref's docs/plugin.schema.json: copy it over"; exit 1; }

  done:
    name: CI passes
    needs: [route, scripts, packages, plugin, cli-main, typescript, parity, schema]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          ROUTE: ${{ needs.route.result }}
          SCRIPTS: ${{ needs.scripts.result }}
          JS: ${{ needs.route.outputs.js }}
          CLI: ${{ needs.route.outputs.cli }}
          PACKAGES: ${{ needs.route.outputs.packages }}
          PARITY: ${{ needs.route.outputs.parity }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
          PLUGIN_RESULT: ${{ needs.plugin.result }}
          CLI_MAIN_RESULT: ${{ needs.cli-main.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          PARITY_RESULT: ${{ needs.parity.result }}
          SCHEMA_RESULT: ${{ needs.schema.result }}
        run: |
          set -euo pipefail
          [ "$ROUTE" = success ] || { echo "::error::the route job ended $ROUTE, so no check ran"; exit 1; }
          [ "$SCRIPTS" = success ] || { echo "::error::the scripts job ended $SCRIPTS"; exit 1; }
          expect() {
            local job=$1 should_run=$2 result=$3
            echo "$job: $result (should run: $should_run)"
            if [ "$should_run" = true ]; then
              [ "$result" = success ] || { echo "::error::$job should have passed and ended $result"; exit 1; }
            else
              [ "$result" = skipped ] || { echo "::error::$job should have been skipped and ended $result"; exit 1; }
            fi
          }
          js=false
          [ "$JS" = "[]" ] || [ -z "$JS" ] || js=true
          expect packages "$PACKAGES" "$PACKAGES_RESULT"
          expect plugin "$js" "$PLUGIN_RESULT"
          expect cli-main "$CLI" "$CLI_MAIN_RESULT"
          expect typescript "$CLI" "$TYPESCRIPT_RESULT"
          expect parity "$PARITY" "$PARITY_RESULT"
          expect schema "$CLI" "$SCHEMA_RESULT"
