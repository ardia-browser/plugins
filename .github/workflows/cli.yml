name: Command Line plugin

on:
  pull_request:
    paths: ["plugins/cli/**", ".github/workflows/cli.yml"]
  push:
    branches: [main]
    paths: ["plugins/cli/**", ".github/workflows/cli.yml"]

permissions:
  contents: read

concurrency:
  group: cli-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: TypeScript ardia on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    defaults:
      run:
        working-directory: plugins/cli/ts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Type check (tsrs)
        run: ./node_modules/.bin/tsrs --noEmit -p .
      - name: Type check the browse daemon harness (tsrs)
        run: ./node_modules/.bin/tsrs --noEmit -p tests/m3
      - name: Build the program and its libc addon, the addon checked against Node's own Node-API headers
        run: sh scripts/build.sh --node-headers "$(dirname "$(dirname "$(realpath "$(command -v node)")")")/include/node"
      - name: Size
        run: |
          echo "ardia-ts binary: $(wc -c < dist/ardia-ts) bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "ardia-libc.so addon: $(wc -c < dist/ardia-libc.so) bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: uv
        run: curl -LsSf https://astral.sh/uv/0.12.15/install.sh | sh
      - name: Unit tests, some beside the Python CLI
        run: |
          ~/.local/bin/uv venv --python 3.13 "$RUNNER_TEMP/unit-venv"
          ARDIA_TEST_PYTHON="$RUNNER_TEMP/unit-venv/bin/python" bun test ./tests
      - name: Parity with the Python CLI
        working-directory: plugins/cli
        env:
          ARDIA_TS_CLI: ${{ github.workspace }}/plugins/cli/ts/dist/ardia-ts
          ARDIA_TEST_REQUIRES: ts
        run: |
          ~/.local/bin/uv venv --python 3.13 "$RUNNER_TEMP/venv"
          VIRTUAL_ENV="$RUNNER_TEMP/venv" ~/.local/bin/uv pip install --quiet --require-hashes --no-build -r requirements.lock
          "$RUNNER_TEMP/venv/bin/python" -m unittest -v tests.test_parity.TsParityTable tests.test_parity.TsDeepFixtures tests.test_parity.TsProcess tests.test_parity.HarnessRules tests.test_parity.HarnessCatches tests.test_parity.ServedTable tests.test_parity.ProtocolAgrees tests.test_parity.BuildSmoke tests.test_closed_stdout.TsClosedStdout tests.test_ts_browse_plugin
      - name: Browse daemon harness, replay mode (recordings answer the Python daemon, no browser)
        if: matrix.os == 'macos-15'
        working-directory: plugins/cli
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest -v tests.test_m3_harness'

  main:
    name: Manifest v2 main on ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/cli
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: hashFiles('plugins/cli/main/package.json') != ''
        with:
          node-version: 24.22.2
      - name: Install, type check, build and test plugins/cli/main
        if: hashFiles('plugins/cli/main/package.json') != ''
        working-directory: plugins/cli/main
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          npm test

  python:
    name: Python tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    defaults:
      run:
        working-directory: plugins/cli
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: uv
        run: curl -LsSf https://astral.sh/uv/0.12.15/install.sh | sh
      - name: Locked dependencies
        run: |
          ~/.local/bin/uv venv --python 3.13 "$RUNNER_TEMP/venv"
          VIRTUAL_ENV="$RUNNER_TEMP/venv" ~/.local/bin/uv pip install --quiet --require-hashes --no-build -r requirements.lock
      - run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests'
      - name: plugin.json passes ardia plugins check
        env:
          ARDIA_DATA_DIR: ${{ runner.temp }}/data
          ARDIA_TELEMETRY: "off"
        run: '"$RUNNER_TEMP/venv/bin/python" -m ardia_cli plugins check "$PWD"'
      - name: The vendored plugin schema is ardia's
        if: matrix.os == 'ubuntu-24.04'
        run: |
          ardia_ref=plugins-v2/native-ui-and-wiring
          set -euo pipefail
          url=https://raw.githubusercontent.com/ardia-browser/ardia/$ardia_ref/docs/plugin.schema.json
          if ! curl -fsSL "$url" -o "$RUNNER_TEMP/ardia-plugin.schema.json"; then
            echo "::warning::ardia $ardia_ref doesn't publish docs/plugin.schema.json: the vendored schema wasn't compared"
            exit 0
          fi
          diff -u "$RUNNER_TEMP/ardia-plugin.schema.json" ardia_cli/schemas/plugin.schema.json \
            || { echo "::error::ardia_cli/schemas/plugin.schema.json isn't ardia $ardia_ref's docs/plugin.schema.json: copy it over"; exit 1; }
