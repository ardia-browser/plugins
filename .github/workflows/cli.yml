name: Command Line plugin

on:
  pull_request:
  push:
    branches: [main]
    paths: ["plugins/cli/**", ".github/workflows/cli.yml", ".github/release/check-build.sh"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    name: Which checks run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cli: ${{ steps.route.outputs.cli }}
      main: ${{ steps.route.outputs.main }}
      parity: ${{ steps.route.outputs.parity }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: .github
      - id: route
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          cli=true
          reason="a $EVENT run checks everything"
          if [ "$EVENT" = pull_request ]; then
            git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/changed"
            cli=false
            reason="no CLI code changed"
            while IFS= read -r -d '' path; do
              case $path in
                plugins/cli/README.md|plugins/cli/docs/*|plugins/cli/bench/*) ;;
                plugins/cli/*|.github/workflows/cli.yml|.github/release/check-build.sh) cli=true; reason="$path changed"; break ;;
              esac
            done < "$RUNNER_TEMP/changed"
          fi
          main=false
          [ "$cli" = false ] || [ -z "$(git ls-tree --name-only HEAD plugins/cli/main/package.json)" ] || main=true
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
          parity=false
          [ "$cli" = false ] || [ -z "$(git ls-tree --name-only HEAD plugins/cli/ts/tests/parity)" ] || parity=true
          echo "main=$main" >> "$GITHUB_OUTPUT"
          echo "parity=$parity" >> "$GITHUB_OUTPUT"
          echo "### CLI checks: $([ "$cli" = true ] && echo run || echo skipped) ($reason)" >> "$GITHUB_STEP_SUMMARY"

  typescript:
    name: TypeScript ardia on ${{ matrix.os }}
    needs: route
    if: needs.route.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cache: ~/Library/Caches/ardia-cli-build
            platform: macos-arm64
          - os: ubuntu-24.04
            cache: ~/.cache/ardia-cli-build
            platform: linux-x64
    defaults:
      run:
        working-directory: plugins/cli/ts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.cache }}
          key: ardia-cli-build-${{ matrix.platform }}-${{ hashFiles('plugins/cli/scripts/build.sh') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Type check (tsrs)
        run: ./node_modules/.bin/tsrs --noEmit -p .
      - name: Type check the browse daemon harness (tsrs)
        run: ./node_modules/.bin/tsrs --noEmit -p tests/m3
      - name: Build the program and its libc addon, the addon checked against Node's own Node-API headers
        run: sh scripts/build.sh --node-headers "$(dirname "$(dirname "$(realpath "$(command -v node)")")")/include/node"
      - name: Size
        run: |
          echo "ardia-ts binary: $(wc -c < dist/ardia-ts) bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "ardia-libc.so addon: $(wc -c < dist/ardia-libc.so) bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: Package the plugin as the release does, and check it
        working-directory: .
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' plugins/cli/plugin.json | head -n 1)
          plugins/cli/build.sh "$RUNNER_TEMP/out"
          .github/release/check-build.sh "$RUNNER_TEMP/out" "$version"
      - name: plugin.json passes ardia plugins check
        working-directory: plugins/cli
        env:
          ARDIA_DATA_DIR: ${{ runner.temp }}/data
          ARDIA_TELEMETRY: "off"
        run: ts/dist/ardia-ts plugins check "$PWD"
      - name: Unit tests, one file per core at a time
        run: bun run test

  parity:
    name: Parity on ${{ matrix.os }}
    needs: route
    if: needs.route.outputs.parity == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    defaults:
      run:
        working-directory: plugins/cli/ts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the TypeScript ardia
        run: sh scripts/build.sh
      - name: Parity cases against their captured results
        run: bun run test:parity

  schema:
    name: The vendored plugin schema is ardia main's
    needs: route
    if: needs.route.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: plugins/cli/ts/assets
      - name: Compare with ardia main's docs/plugin.schema.json
        run: |
          ardia_ref=main
          set -euo pipefail
          url=https://raw.githubusercontent.com/ardia-browser/ardia/$ardia_ref/docs/plugin.schema.json
          if ! curl -fsSL "$url" -o "$RUNNER_TEMP/ardia-plugin.schema.json"; then
            echo "::warning::ardia $ardia_ref doesn't publish docs/plugin.schema.json: the vendored schema wasn't compared"
            exit 0
          fi
          diff -u "$RUNNER_TEMP/ardia-plugin.schema.json" plugins/cli/ts/assets/plugin.schema.json \
            || { echo "::error::plugins/cli/ts/assets/plugin.schema.json isn't ardia $ardia_ref's docs/plugin.schema.json: copy it over"; exit 1; }

  main:
    name: Manifest v2 main on ubuntu-24.04
    needs: route
    if: needs.route.outputs.main == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/cli/main
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - name: Install, type check, build and test plugins/cli/main
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          npm test

  done:
    name: CLI checks pass
    needs: [route, typescript, parity, schema, main]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          ROUTE: ${{ needs.route.result }}
          CLI: ${{ needs.route.outputs.cli }}
          MAIN: ${{ needs.route.outputs.main }}
          TYPESCRIPT: ${{ needs.typescript.result }}
          PARITY: ${{ needs.route.outputs.parity }}
          PARITY_RESULT: ${{ needs.parity.result }}
          SCHEMA: ${{ needs.schema.result }}
          MAIN_RESULT: ${{ needs.main.result }}
        run: |
          set -euo pipefail
          [ "$ROUTE" = success ] || { echo "::error::the route job ended $ROUTE, so no check ran"; exit 1; }
          expect() {
            local job=$1 should_run=$2 result=$3
            echo "$job: $result (should run: $should_run)"
            if [ "$should_run" = true ]; then
              [ "$result" = success ] || { echo "::error::$job should have passed and ended $result"; exit 1; }
            else
              [ "$result" = skipped ] || { echo "::error::$job should have been skipped and ended $result"; exit 1; }
            fi
          }
          expect typescript "$CLI" "$TYPESCRIPT"
          expect parity "$PARITY" "$PARITY_RESULT"
          expect schema "$CLI" "$SCHEMA"
          expect main "$MAIN" "$MAIN_RESULT"
