name: 1Password plugin

on:
  pull_request:
    paths: ["plugins/1password/**", ".github/workflows/1password.yml"]
  push:
    branches: [main]
    paths: ["plugins/1password/**", ".github/workflows/1password.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 1password-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin:
    name: 1Password on ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/1password/main
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Pack the plugin folder
        working-directory: .
        run: |
          set -eu
          plugins/1password/build.sh "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/out"
          sha256sum -c 1password-plugin-*.tar.gz.sha256
          tar -tzf 1password-plugin-*.tar.gz | sort > files.txt
          printf '%s\n' 1password/ 1password/dist/ 1password/dist/main.js 1password/plugin.json > expected.txt
          diff -u expected.txt files.txt
          echo "1password: $(wc -c < 1password/dist/main.js) bytes of main.js, sha256 $(cut -d' ' -f1 1password-plugin-*.tar.gz.sha256)" >> "$GITHUB_STEP_SUMMARY"
